name: Capture restaurant screenshots

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/capture-restaurant-screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture live project screenshots
        run: |
          mkdir -p public/project-images
          cat > capture-restaurants.mjs <<'EOF'
          import { chromium } from 'playwright';
          const projects = [
            { name: 'amber-oak-restaurant', url: 'https://amber-oak-restaurant.vercel.app/' },
            { name: 'saffron-slate-restaurant', url: 'https://saffron-slate-restaurant.vercel.app/' },
          ];
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1600, height: 900 }, deviceScaleFactor: 1 });
          for (const project of projects) {
            const response = await page.goto(project.url, { waitUntil: 'networkidle', timeout: 90000 });
            if (!response || !response.ok()) throw new Error(`${project.name} returned ${response?.status()}`);
            await page.waitForTimeout(3000);
            await page.screenshot({ path: `public/project-images/${project.name}.png`, fullPage: false });
          }
          await browser.close();
          EOF
          node capture-restaurants.mjs

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-images/amber-oak-restaurant.png public/project-images/saffron-slate-restaurant.png
          git commit -m "chore: capture current restaurant screenshots"
          git push origin master
